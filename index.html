<!doctype html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CareerFlow" />
    <meta name="application-name" content="CareerFlow" />
    <link rel="apple-touch-icon" sizes="180x180" href="/todo-apple-mobile/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="icon" href="%BASE_URL%favicon-v4.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="%BASE_URL%favicon-v4.ico" type="image/png" />
    <title>CareerFlow</title>
    <style>
      html, body, #root { background-color: #f7f7f8; }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background-color: #000000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("careerflow-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          const root = document.documentElement;
          const themeColor = isDark ? "#000000" : "#f7f7f8";
          const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          root.dataset.theme = isDark ? "dark" : "light";
          root.dataset.displayMode = isStandalone ? "standalone" : "browser";
          root.style.colorScheme = isDark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor);
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute("content", isDark ? "black" : "default");
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
